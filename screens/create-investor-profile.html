<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Investor Profile — InvestMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="header.css">
</head>
<body style="background:#f6f3f1;">
  <div id="header-root"></div>
  <script src="icons.js"></script>
  <script src="header.js"></script>
  <script src="components.js"></script>
  <script>injectHeader('public');</script>

  <div class="auth-container" style="max-width:640px; margin:2rem auto; padding:2.5rem; background:white; border-radius:2.5rem;">
    <h2 style="text-align:center;margin-bottom:0.25rem;">Investor / Buyer Profile</h2>
    <p style="text-align:center;color:#666;">Define your investment mandate and get matched with opportunities.</p>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.5rem;">
      <div class="input-group">
        <label>Full Name / Company Name</label>
        <input type="text" class="input" placeholder="e.g., Ramesh Thapa">
      </div>
      <div class="input-group">
        <label>Investor Type</label>
        <select class="input">
          <option>Individual Investor</option>
          <option>Angel Investor</option>
          <option>Venture Capital</option>
          <option>Private Equity</option>
          <option>Family Office</option>
          <option>Corporate Acquirer</option>
          <option>Lender / NBFC</option>
          <option>M&amp;A Advisor</option>
        </select>
      </div>
      <div class="input-group">
        <label>Location</label>
        <input type="text" class="input" value="Kathmandu, Nepal">
      </div>
      <div class="input-group">
        <label>Investment Size Range</label>
        <select class="input">
          <option>Under NPR 25 Lakh</option>
          <option>NPR 25 Lakh – 1 Cr</option>
          <option>NPR 1 – 5 Cr</option>
          <option>NPR 5 – 25 Cr</option>
          <option>NPR 25 – 100 Cr</option>
          <option>NPR 100 Cr+</option>
        </select>
      </div>
      <div class="input-group" style="grid-column:1/-1;">
        <label>Preferred Industries</label>
        <input type="text" class="input" placeholder="e.g., AgriTech, CleanTech, Manufacturing">
      </div>
      <div class="input-group" style="grid-column:1/-1;">
        <label>Background &amp; Interests</label>
        <textarea class="input" placeholder="Tell businesses about your background, investment thesis, and what you're looking for..." style="min-height:100px;"></textarea>
      </div>
    </div>

    <button class="btn btn-primary" style="width:100%;margin-top:1rem;" onclick="alert('Investor profile created! (demo)')">Submit for Review</button>
  </div>

  <div id="footer-root"></div>
  <script>injectFooter();</script>
</body>
</html>
