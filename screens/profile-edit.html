<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile — InvestMatch Nepal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="header.css">
</head>
<body>
  <!-- Reusable Header -->
  <div id="header-root"></div>
  <script src="icons.js"></script>
  <script src="header.js"></script>
  <script src="components.js"></script>
  <script>injectHeader('public');</script>
  
  <div class="container" style="max-width:780px; padding:2rem 0 3rem;">
    <h2>Edit Investor Profile</h2>
    
    <div class="card">
      <h4>Basic Information</h4>
      <div class="form-grid edit-form-grid">
        <div class="input-group"><label>Full Name</label><input class="input" value="Ramesh Thapa"></div>
        <div class="input-group"><label>Company (if any)</label><input class="input" value="Thapa Capital"></div>
        <div class="input-group"><label>Location</label><input class="input" value="Kathmandu, Bagmati"></div>
        <div class="input-group"><label>LinkedIn / Website</label><input class="input" value="linkedin.com/in/ramesht"></div>
      </div>
      <div class="input-group"><label>Bio (max 250 words)</label><textarea>Angel investor focused on climate and agri-tech. Previously founded two Nepali SaaS companies.</textarea></div>
    </div>
    
    <div class="card" style="margin-top:1.5rem;">
      <h4>Investment Preferences</h4>
      <div class="prefs-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
        <div class="input-group"><label>Preferred Sectors</label><input class="input" value="AgriTech, CleanTech, HealthTech"></div>
        <div class="input-group"><label>Ticket Size Range (NPR)</label><input class="input" value="15M – 80M"></div>
        <div class="input-group"><label>Preferred Stages</label><select class="select"><option>MVP + Early Revenue</option></select></div>
        <div class="input-group"><label>Geography</label><input class="input" value="Bagmati, Gandaki, Anywhere"></div>
      </div>
    </div>
    
    <div style="margin-top:1.5rem; display:flex; gap:1rem;">
      <a href="investor-dashboard.html" class="btn btn-secondary">Cancel</a>
      <button onclick="alert('Profile saved! (demo)'); location.href='investor-dashboard.html'" class="btn btn-primary">Save Changes</button>
    </div>

    <div style="margin-top:1.25rem; font-size:0.85rem;">
      <a href="investor-profile-edit-investment-preferences.html" style="color:#C41E3A;">Edit Investment Preferences →</a><br>
      <a href="investor-profile-edit-verification-documents.html" style="color:#C41E3A;">Manage Verification Documents →</a>
    </div>
  </div>

  <div id="footer-root"></div>
  <script>injectFooter();</script>
</body>
</html>
