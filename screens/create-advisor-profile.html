<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Advisor Profile — InvestMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="header.css">
</head>
<body style="background:#f6f3f1;">
  <div id="header-root"></div>
  <script src="icons.js"></script>
  <script src="header.js"></script>
  <script src="components.js"></script>
  <script>injectHeader('public');</script>

  <div class="auth-container" style="max-width:640px; margin:2rem auto; padding:2.5rem; background:white; border-radius:2.5rem;">
    <h2 style="text-align:center;margin-bottom:0.25rem;">Advisor / Professional Profile</h2>
    <p style="text-align:center;color:#666;">Register as an M&A advisor, business broker, consultant, or law firm.</p>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.5rem;">
      <div class="input-group">
        <label>Full Name / Firm Name</label>
        <input type="text" class="input" placeholder="e.g., Krishna & Associates">
      </div>
      <div class="input-group">
        <label>Advisor Type</label>
        <select class="input">
          <option>M&A Advisor</option>
          <option>Business Broker</option>
          <option>Financial Consultant</option>
          <option>Accountant / CA Firm</option>
          <option>Law Firm</option>
          <option>Investment Bank</option>
          <option>CRE Broker</option>
        </select>
      </div>
      <div class="input-group">
        <label>Location</label>
        <input type="text" class="input" placeholder="e.g., Kathmandu, Nepal">
      </div>
      <div class="input-group">
        <label>Years of Experience</label>
        <input type="text" class="input" placeholder="e.g., 15">
      </div>
      <div class="input-group" style="grid-column:1/-1;">
        <label>Specialization &amp; Track Record</label>
        <textarea class="input" placeholder="Describe your expertise, past deals closed, industries served..." style="min-height:100px;"></textarea>
      </div>
    </div>

    <button class="btn btn-primary" style="width:100%;margin-top:1rem;" onclick="alert('Advisor profile created! (demo)')">Submit for Review</button>
  </div>

  <div id="footer-root"></div>
  <script>injectFooter();</script>
</body>
</html>
